<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>스피커 추천목록 이미지</title>
    <style>
      body { margin: 0; background: #f4f5f7; color: #171717; font-family: system-ui, sans-serif; }
      main { width: min(1480px, calc(100% - 24px)); margin: 28px auto 60px; }
      p { color: #555; }
      section { margin-top: 28px; padding: 14px; border: 1px solid #d9dce1; border-radius: 12px; background: white; overflow-x: auto; }
      h2 { margin: 4px 0 12px; font-size: 18px; }
      img { display: block; width: 100%; min-width: 900px; height: auto; }
    </style>
  </head>
  <body><main>
    <h1>스피커 추천목록 이미지</h1>
    <p>2026-08-04 12:00 KST 기준 · 매일 00:00와 12:00 KST에 자동 생성</p>
      <section><h2>액티브 스피커</h2><img src="./active.svg" alt="액티브 스피커 추천목록"></section>
      <section><h2>액티브 스피커 · 소형</h2><img src="./small-active.svg" alt="액티브 스피커 · 소형 추천목록"></section>
      <section><h2>패시브 스피커 · 북쉘프</h2><img src="./bookshelf.svg" alt="패시브 스피커 · 북쉘프 추천목록"></section>
      <section><h2>패시브 스피커 · 톨보이</h2><img src="./floorstanding.svg" alt="패시브 스피커 · 톨보이 추천목록"></section>
      <section><h2>앰프</h2><img src="./amp.svg" alt="앰프 추천목록"></section>
  </main></body>
</html>
