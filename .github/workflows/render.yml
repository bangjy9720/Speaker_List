name: Render and deploy speaker list images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render.yml"
      - "scripts/**"
      - "tests/**"
      - "package.json"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # 운영 렌더링은 "12h" 모드를 사용합니다. "minute"은 일시적인 수동 검증용입니다.
  REFRESH_MODE: "12h"

concurrency:
  group: speaker-list-render
  cancel-in-progress: false

jobs:
  render-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test renderer
        run: npm test
      - name: Render SVG images
        run: npm run render
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Re-run jobs에서도 이전 시도의 아티팩트와 겹치지 않도록 실행 시도별 이름을 사용합니다.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
