name: Render and deploy speaker list images

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render.yml"
      - "scripts/**"
      - "tests/**"
      - "package.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: speaker-list-render
  cancel-in-progress: false

jobs:
  render-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test renderer
        run: npm test
      - name: Render SVG images
        run: npm run render
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
